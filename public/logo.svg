<svg width="500" height="500" viewBox="0 0 500 500" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="5" />
      <feOffset dx="2" dy="2" result="offsetblur" />
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.5" />
      </feComponentTransfer>
      <feMerge>
        <feMergeNode />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <linearGradient id="goldGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#FFD54F;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#FFC107;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- ALFA Text -->
  <text x="50%" y="240" text-anchor="middle" font-family="Arial Black, sans-serif" font-size="140" font-weight="900" fill="url(#goldGradient)" stroke="#8B0000" stroke-width="8" filter="url(#shadow)">ALFA</text>
  
  <!-- PEDIDOS Text -->
  <text x="50%" y="340" text-anchor="middle" font-family="Arial Black, sans-serif" font-size="60" font-weight="900" fill="url(#goldGradient)" stroke="#8B0000" stroke-width="4" filter="url(#shadow)">PEDIDOS</text>
  
  <!-- Arrow -->
  <path d="M280 360 Q380 360 420 320" stroke="#FFC107" stroke-width="12" fill="none" stroke-linecap="round" filter="url(#shadow)" />
  <path d="M400 335 L425 315 L405 305" fill="#FFC107" filter="url(#shadow)" />
</svg>
